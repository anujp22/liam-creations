name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch cancels the previous run — no point burning
# minutes on a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/catalog-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # 'clean' matters: moving resources (as A3 did with the seed migrations)
      # leaves stale copies in target/ that can make a broken build look green.
      - name: Verify
        run: mvn -B clean verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 'ci' not 'install' — installs exactly the lockfile and fails if
      # package.json and the lockfile have drifted apart.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs `tsc -b && vite build`. Until the frontend has tests, this is the
      # only correctness gate it has.
      - name: Build
        run: npm run build
