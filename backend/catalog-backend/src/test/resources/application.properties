admin.username=admin
admin.password=test

# This file replaces src/main/resources/application.properties rather than adding to it,
# so the admin session cookie settings have to be repeated here for anything that reads
# them. AdminSessionAuthTest asserts the real values against the main file.
server.servlet.session.cookie.name=LC_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true
app.session.cookie-secure=true
