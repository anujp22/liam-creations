spring.datasource.url=jdbc:postgresql://localhost:5432/instagram_catalog
spring.datasource.username=catalog_user
spring.datasource.password=catalog_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Schema migrations live in db/migration; the 100 demo products (V2, V3) live in
# db/seed and are loaded for local development only. The prod profile overrides this
# to drop the seeds so a real catalog never gets seeded with fake inventory.
#
# db/migration-postgresql holds migrations Postgres accepts and H2 does not — currently
# the A14 partial indexes. It is a sibling of db/migration rather than a subdirectory
# because Flyway scans locations recursively, so a subdirectory would be picked up by
# the H2 test database too and fail on the first CREATE INDEX ... WHERE.
spring.flyway.locations=classpath:db/migration,classpath:db/migration-postgresql,classpath:db/seed

# Cap client-supplied page size so ?size= can't pull the whole table in one query.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# Admin credentials (override via environment variables in production)
# Dummy dev login -> username: admin   password: admin123
admin.username=admin
admin.password=admin123

# Image storage backend: "local" (disk, dev default) or "s3". Uploads are resized to a
# ~1600px web image plus a 400px thumbnail either way — see ImageProcessor.
app.storage=${APP_STORAGE:local}

# Local image uploads (dev). Served at /uploads/**.
app.uploads.dir=${APP_UPLOADS_DIR:uploads}

# S3 storage (only read when app.storage=s3). Credentials come from the default AWS
# chain — environment variables or the instance role — never from this file.
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${S3_REGION:}
app.storage.s3.key-prefix=${S3_KEY_PREFIX:products/}
# Relative by default so image URLs in the database stay portable across hosts; the edge
# routes /uploads/* to the bucket. Set to a CDN origin to store absolute URLs instead.
app.storage.s3.public-url-prefix=${S3_PUBLIC_URL_PREFIX:/uploads/}
# Only for an S3-compatible service (MinIO/LocalStack); leave blank for real AWS.
app.storage.s3.endpoint=${S3_ENDPOINT:}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=40MB

# Reverse proxies in front of the app, used to pick the real client IP out of
# X-Forwarded-For for rate limiting. 0 = no proxy, trust the socket address (dev).
app.trusted-proxy-count=${TRUSTED_PROXY_COUNT:0}

# CORS allowed origins (override CORS_ALLOWED_ORIGIN_PROD in production)
cors.allowed-origin.dev=http://localhost:5173
cors.allowed-origin.prod=${CORS_ALLOWED_ORIGIN_PROD:https://placeholder.cloudfront.net}

# Public storefront base URL, used to build absolute sitemap URLs (set in prod).
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:5173}

# Actuator — expose only the health endpoint (required for ECS container health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Include the per-request correlation id (set by RequestLoggingFilter) in every log line.
logging.pattern.level=%5p [%X{requestId:-}]
