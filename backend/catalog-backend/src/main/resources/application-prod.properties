# Production profile — all sensitive values must be provided via environment variables.
# Activate with: SPRING_PROFILES_ACTIVE=prod
#
# Required environment variables:
#   DB_URL                    - JDBC URL, e.g. jdbc:postgresql://host:5432/instagram_catalog
#   DB_USERNAME               - Database user
#   DB_PASSWORD               - Database password
#   ADMIN_USERNAME            - HTTP Basic admin username
#   ADMIN_PASSWORD            - HTTP Basic admin password. Enforced at startup by
#                               AdminCredentialsValidator: at least 12 characters, not
#                               a well-known default such as admin123, and not equal to
#                               ADMIN_USERNAME. The app refuses to boot otherwise.
#   CORS_ALLOWED_ORIGIN_PROD  - CloudFront domain, e.g. https://dXXXXXX.cloudfront.net
#   PUBLIC_BASE_URL           - Storefront domain used to build absolute sitemap URLs
#   S3_BUCKET                 - Bucket holding product photos
#   S3_REGION                 - Bucket region, e.g. ap-south-1
#
# Optional environment variables:
#   S3_KEY_PREFIX             - Key prefix inside the bucket. Defaults to products/
#   S3_PUBLIC_URL_PREFIX      - Defaults to /uploads/ (relative). The edge must route
#                               /uploads/* at the bucket. Set to a CDN origin only if
#                               you accept absolute URLs being baked into every row.
#   TRUSTED_PROXY_COUNT       - Reverse proxies in front of the app. Defaults to 2 here
#                               (CloudFront + ALB). MUST match the real deployment: too
#                               low and every visitor shares one rate-limit bucket, too
#                               high and clients can forge the address we key on.

# Schema only — never the db/seed demo products. Without this override a fresh
# production database would be populated with 100 fake sarees on first boot.
spring.flyway.locations=classpath:db/migration

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Empty defaults on purpose. Without them an unset ADMIN_PASSWORD fails as a raw
# placeholder-resolution error deep in a Spring stack trace; with them it reaches
# AdminCredentialsValidator, which refuses to start and says exactly which variable to
# set. The app never runs with a blank or default admin password either way.
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}

cors.allowed-origin.prod=${CORS_ALLOWED_ORIGIN_PROD}

# No default on purpose: the dev fallback is http://localhost:5173, and inheriting it
# here would publish a sitemap full of localhost URLs to search engines. Failing to
# start is the better outcome.
app.public-base-url=${PUBLIC_BASE_URL}

# client → CloudFront → ALB → app
app.trusted-proxy-count=${TRUSTED_PROXY_COUNT:2}

# Photos must not live in the container filesystem — it is wiped on every deploy.
# No defaults for bucket and region: starting without them would silently accept
# uploads that vanish at the next deploy.
app.storage=${APP_STORAGE:s3}
app.storage.s3.bucket=${S3_BUCKET}
app.storage.s3.region=${S3_REGION}
